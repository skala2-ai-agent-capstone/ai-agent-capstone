# 백엔드(aworko-server)·RabbitMQ·중간 피드백 Worker를 MCP와 같은 서버·같은 내부망에 올리는 추가 파일.
# MCP만 쓸 때는 필요 없다. 전체를 올릴 때만 두 파일을 같이 준다(.env에 COMPOSE_FILE을 두면 생략 가능):
#   docker compose -f docker-compose.yml -f docker-compose.app.yml --profile llm up -d --build
# 순서: postgres → db-init(스키마·적재) → business-mcp → rabbitmq → backend(큐 선언·Flyway) → feedback-worker
# 백엔드 저장소는 이 저장소 옆(../../aworko-server)에 받아 둔다. 다른 곳이면 .env의 BACKEND_DIR.
# 절차·토큰 발급: ../docs/deploy_server.md

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-axeval}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?.env에 RABBITMQ_PASSWORD 필요}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # 백엔드·Worker는 내부망(rabbitmq:5672)으로 붙는다. 관리 화면은 서버 안에서만(ssh 터널로 확인)
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ${BACKEND_DIR:-../../aworko-server}
    image: aworko/server:${BACKEND_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/axeval
      DB_USERNAME: axeval
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-axeval}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env에 RABBITMQ_PASSWORD 필요}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET 필요}
      # 중간 피드백 요청 행은 business-mcp 내부 API가 만든다(범위·대화 스냅샷 고정)
      MCP_INTERNAL_URL: http://business-mcp:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?.env에 INTERNAL_API_KEY 필요}
      # 업무 공간 대화. llm-proxy를 거쳐야 대화가 llm_exchanges(→ messages 뷰)에 기록된다
      LLM_PROXY_URL: http://llm-proxy:4000
      LLM_PROXY_KEY: ${WORKSPACE_LLM_API_KEY:?.env에 WORKSPACE_LLM_API_KEY 필요}
      LLM_MODEL: ${SERVED_MODEL_NAME:-gemma4}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # 최종 평가 Worker가 읽는 평가별 실행 토큰 파일. 백엔드가 /internal/runs로 발급해 몇 초마다 갱신한다
      FINAL_TOKEN_FILE: /app/run-tokens/final-tokens.json
    volumes:
      - run-tokens:/app/run-tokens
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      db-init:   # MCP 스키마가 먼저 있어야 Flyway V1(FK)과 JPA 검증이 통과한다
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      business-mcp:
        condition: service_healthy
    restart: unless-stopped

  feedback-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: ax-eval/feedback-worker:${WORKER_TAG:-local}
    environment:
      FEEDBACK_AMQP_URL: amqp://${RABBITMQ_USERNAME:-axeval}:${RABBITMQ_PASSWORD:?.env에 RABBITMQ_PASSWORD 필요}@rabbitmq:5672/
      FEEDBACK_MCP_URL: http://business-mcp:8001/mcp
      # business-mcp가 뜬 뒤 /internal/live-worker-token으로 발급한다(회사 범위, 기본 30일). 절차: docs/deploy_server.md
      FEEDBACK_MCP_TOKEN: ${FEEDBACK_MCP_TOKEN:?.env에 FEEDBACK_MCP_TOKEN 필요 (docs/deploy_server.md 3단계)}
      # llm-proxy로 부른다. 프록시가 live_evaluate 단계를 OPENAI_STAGES에 따라 OpenAI로 보낸다.
      # 모델 이름은 실제로 쓰는 모델과 같게 둔다(결과의 실행 정보에 남는다). OPENAI_STAGES에서
      # live_evaluate를 빼서 vLLM으로 돌릴 때는 FEEDBACK_LLM_MODEL을 SERVED_MODEL_NAME으로 바꾼다
      FEEDBACK_LLM_BASE_URL: ${FEEDBACK_LLM_BASE_URL:-http://llm-proxy:4000/v1}
      FEEDBACK_LLM_MODEL: ${FEEDBACK_LLM_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}
      # llm-proxy를 쓸 때는 PROXY_KEYS에 feedback-worker:<이 값>으로 같이 넣는다. 이름이 llm_exchanges.member에 남는다
      FEEDBACK_LLM_API_KEY: ${FEEDBACK_LLM_API_KEY:?.env에 FEEDBACK_LLM_API_KEY 필요}
    volumes:
      - feedback-traces:/app/outputs/feedback-traces   # 실행 추적(원문 없음). 쓰기 실패하면 메시지가 재시도 루프에 걸린다
    depends_on:
      backend:   # 큐·교환기는 백엔드가 선언한다. Worker는 있는지만 확인한다
        condition: service_healthy
      business-mcp:
        condition: service_healthy
    restart: unless-stopped

  # 최종 평가 Worker(backend-v1): evaluation.requests의 EVALUATE를 받아 초안·코칭을 MCP에 저장하고
  # evaluation.results로 완료를 알린다(백엔드가 '확인 대기'로 바꿈). 실행 토큰은 백엔드가 쓰는 파일을 읽기만 한다.
  # 기본으로는 뜨지 않는다: --profile final. 띄우기 전 확인할 것은 ../docs/backend_worker_alignment.md 5절
  final-worker:
    image: ax-eval/feedback-worker:${WORKER_TAG:-local}   # feedback-worker와 같은 이미지(Dockerfile.worker)
    profiles: ["final"]
    command: ["python", "-m", "ai_agents.cli.final_worker", "worker", "--contract", "backend-v1",
              "--token-file", "outputs/run-tokens/final-tokens.json",
              "--checkpoint-dir", "outputs/final-checkpoints", "--trace-dir", "outputs/final-worker-traces"]
    environment:
      FINAL_AMQP_URL: amqp://${RABBITMQ_USERNAME:-axeval}:${RABBITMQ_PASSWORD:?.env에 RABBITMQ_PASSWORD 필요}@rabbitmq:5672/
      FINAL_BUSINESS_MCP_URL: http://business-mcp:8001/mcp
      FINAL_RAG_MCP_URL: http://rag-mcp:8002/mcp
      # llm-proxy가 evaluate 단계를 OPENAI_STAGES에 따라 OpenAI로 보낸다. 모델 이름은 실제 모델과 같게 둔다
      FINAL_LLM_BASE_URL: ${FINAL_LLM_BASE_URL:-http://llm-proxy:4000/v1}
      FINAL_LLM_MODEL: ${FINAL_LLM_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}
      # PROXY_KEYS에 final-worker:<이 값>으로 같이 넣는다. profile을 안 쓸 때도 compose가 읽으므로 필수 표시는 하지 않는다
      FINAL_LLM_API_KEY: ${FINAL_LLM_API_KEY:-}
    volumes:
      - run-tokens:/app/outputs/run-tokens:ro
      - final-checkpoints:/app/outputs/final-checkpoints   # 재시도가 같은 체크포인트를 이어 쓴다. 지우면 처음부터 다시 평가
      - final-worker-traces:/app/outputs/final-worker-traces
    depends_on:
      backend:   # 큐(완료 큐 포함)와 토큰 파일은 백엔드가 만든다
        condition: service_healthy
      business-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq-data:
  feedback-traces:
  run-tokens:
  final-checkpoints:
  final-worker-traces:
