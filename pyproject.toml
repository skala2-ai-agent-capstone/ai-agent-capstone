[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agents"
version = "0.1.0"
description = "업무 분류·평가 기준 생성·업무 평가 Agent와 MCP 연동"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.1.2,<4",
  "langsmith>=0.14.11,<0.15",
  "mcp>=2,<3",
  "openai>=2,<3",
  "pdfplumber>=0.11,<0.12",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
ai-agents = "ai_agents.cli.classification:main"

[project.optional-dependencies]
worker = [
    "aio-pika>=9.5,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

